# Render.com "Blueprint": one file that provisions the whole backend.
# In the Render dashboard: New + → Blueprint → connect this repo → Apply.
# Render reads this file, creates the API + a Postgres database, wires them
# together, and generates a secret for you. No manual config needed.
databases:
  - name: pickly-db
    plan: free
    databaseName: pickly
    user: pickly

services:
  - type: web
    name: pickly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true        # Render makes a strong random secret
      - key: DATABASE_URL
        fromDatabase:
          name: pickly-db
          property: connectionString
