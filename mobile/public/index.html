<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, maximum-scale=1"
    />
    <title>Pickly</title>

    <!-- Makes "Add to Home Screen" launch full-screen with no Safari
         chrome, so it opens and feels like a real installed app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pickly" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Same for Android/Chrome's "Add to Home Screen". -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Tints the browser's own UI (status bar/toolbar) — was the old bright
         brand green from before the dark editorial redesign; now matches
         the actual default background. -->
    <meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Standalone PWA on iOS (Add to Home Screen): `100%`/`100vh` here
           resolves against the *layout* viewport, which is shorter than the
           real visual viewport once the home-indicator safe area is
           counted — the gap below is native WKWebView chrome (black),
           not this document, so no background-color on html/body can ever
           paint over it. `100dvh` (dynamic viewport height) is measured
           against the actual visual viewport instead and closes that gap.
           Kept as a second declaration, not a replacement — a browser that
           doesn't understand `dvh` just ignores the line and keeps `100%`. */
        height: 100dvh;
        /* iOS Safari reveals whatever is behind #root — its own toolbar
           collapsing on scroll changes the viewport height, and rubber-band
           overscroll shows past the content entirely — both expose raw
           html/body. Left unset that's browser-default white, which shows
           as a stray white patch at the bottom of an otherwise dark app.
           App default is dark (ThemeContext.js), so that's the static
           default here too; prefers-color-scheme covers a light OS setting
           before the real theme (which also respects an explicit in-app
           override, not just OS setting) has booted. */
        background-color: #16181a;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #f6f8f7;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh; /* see the html/body rule above */
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
